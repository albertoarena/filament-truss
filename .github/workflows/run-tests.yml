name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        stability: [prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          # Laravel 13 and Testbench 11 both require PHP ^8.3, so this pair
          # cannot resolve. PHP 8.2 is covered by the Laravel 12 lane, which is
          # the combination a host on 8.2 actually runs.
          - php: '8.2'
            laravel: '13.*'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      # `composer update` rather than an install from a lockfile, and not only
      # because composer.lock is gitignored. The page reproduces Truss's
      # container markup, and the drift guard in
      # tests/Pages/SchemaPageRenderTest.php compares it against the Truss
      # release that actually resolved. Pinning here would hide the upgrade that
      # breaks the page, which is the one thing this suite exists to catch early.
      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest

  # SQLite only, deliberately. The schema itself comes from Truss, which tests
  # its own readers against MySQL and Postgres lanes of its own; nothing in this
  # package reads a database directly, so a second engine here would re-test
  # upstream's work and not ours.
  #
  # The coverage floor keeps the gap between "there is a test" and "the test
  # reaches the code" visible.
  coverage:
    runs-on: ubuntu-latest
    name: Coverage - PHP 8.4 - Laravel 12

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: pcov

      - name: Install dependencies
        run: |
          composer require "laravel/framework:12.*" "orchestra/testbench:10.*" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run tests with coverage
        run: vendor/bin/pest --coverage --min=90
