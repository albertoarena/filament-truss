name: frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 22 rather than 20: Vitest itself runs on 20, but its transitive CSS
      # tooling asks for 20.19 and up, so the older major only installs with
      # warnings.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # package-lock.json is gitignored, so there is no committed lockfile for
      # npm ci; install from package.json instead.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The two client-side files this package ships: the dark mode bridge and
      # the containment stylesheet. There is no build step, so these tests read
      # exactly what the browser is served.
      #
      # There is no browser lane here yet, and that gap is deliberate rather than
      # forgotten: a browser test needs a Filament panel to render the page, which
      # is a host application this repository does not have. Until it does, the
      # rendering and interaction side is covered by the manual checklist in
      # docs/MANUAL-TESTS.md.
      - name: Unit tests (Vitest)
        run: npm test
