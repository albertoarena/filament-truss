name: frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      # `npm ci` from a committed lockfile, which is the opposite of what the
      # Composer side does and is deliberate: package-lock.json locks test
      # tooling, nothing a consumer of this package installs.
      #
      # It is also what fixes this job. The first run resolved the tree from
      # package.json alone and npm crashed in its own resolver
      # ("Cannot read properties of null (reading 'edgesOut')"), identically on a
      # re-run of the same commit, so it was the install and not a flake. An
      # install that can pick a different transitive tree on every run is a poor
      # thing to have between a push and a green tick anyway.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Composer, in the JavaScript job, for one test. The focus deep link is a
      # query parameter this package writes and Truss's frontend reads, so the
      # guard imports `url-state.js` out of the installed package and runs it,
      # rather than restating the parameter name and guarding nothing. That
      # needs a vendor directory here.
      #
      # `composer update` rather than an install from a lockfile, for the same
      # reason the test suite does it: the point is to meet the Truss release
      # that actually resolves, so an upstream rename fails here instead of
      # shipping.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install Truss, which one test reads
        run: composer update --prefer-stable --prefer-dist --no-interaction

      # The two client-side files this package ships: the dark mode bridge and
      # the containment stylesheet. There is no build step, so these tests read
      # exactly what the browser is served.
      #
      # There is no browser lane here yet, and that gap is deliberate rather than
      # forgotten: a browser test needs a Filament panel to render the page, which
      # is a host application this repository does not have. Until it does, the
      # rendering and interaction side is covered by the manual checklist in
      # docs/MANUAL-TESTS.md.
      - name: Unit tests (Vitest)
        run: npm test
